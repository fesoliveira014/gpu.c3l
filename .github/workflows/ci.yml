name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  C3C_VERSION: "0.8.0"
  VULKAN_SDK_VERSION: "1.3.290.0"
  MESA_DIST_WIN_VERSION: "25.1.5"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT (Contents: read) covering this repo + the private
          # binding submodules; default GITHUB_TOKEN cannot read sibling repos.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install glslc and lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y glslc mesa-vulkan-drivers vulkan-validationlayers vulkan-tools

      - name: CPU-only tests (no native libs)
        run: |
          c3c test unit --path test/cpu
          c3c test shader_abi --path test/cpu

      - name: Generator unit tests
        run: c3c test unit --path tools/gen_shader_abi

      - name: ABI drift gate
        run: python3 scripts/gen_abi.py --check

      - name: Build shaders
        run: python3 scripts/build_shaders.py

      - name: Test sweep (lavapipe)
        run: |
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "ICD: $VK_DRIVER_FILES"
          vulkaninfo --summary | head -30 || true
          FAIL=0
          for t in vk_bootstrap vk_command vk_texture vk_descriptor_heap \
                   vk_root_pointer vk_texture_heap vk_shader_reflection vk_offscreen \
                   vk_swapchain vk_pipeline_cache vk_indirect vk_indexed_draw vk_depth vk_threading vk_queue vk_debug \
                   upload_bench_observation; do
            echo "::group::$t"
            if ! c3c test "$t" --path test; then
              echo "::error::target $t failed"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

      # Whole-compile reference (public module gpu + gpu::vk internals; a
      # scoped docgen needs a closed source set, which only the whitebox test
      # project provides). Published per-run; Pages publishing is #29.
      - name: Generate API reference
        run: |
          cd test && c3c docgen
      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: test/docs.html

  docs-walkthrough:
    # Executes the marked Linux blocks in docs/getting_started.md through
    # scripts/run_doc.py on a bare runner. Windows package commands are checked
    # and executed by package-consumer-windows. Only the checkout,
    # PR-local URL override, and private-phase clone shim are outside the doc.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install walkthrough prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools

      # private-phase: rewrite the doc's public clone URL through the PAT so
      # the recursive clone reaches the private repos. Delete this step (and
      # nothing else) when the repositories go public.
      - name: Authenticate submodule clones
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/fesoliveira014/".insteadOf \
            "https://github.com/fesoliveira014/"

      - name: Run the walkthrough
        run: |
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export GPU_C3L_URL="$GITHUB_WORKSPACE"
          python3 scripts/run_doc.py docs/getting_started.md --workspace /tmp/walkthrough

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT (Contents: read) covering this repo + the private
          # binding submodules; default GITHUB_TOKEN cannot read sibling repos.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/c3
            ~/tools/VulkanSDK
            ~/tools/VulkanRT
            ~/tools/vma
            ~/tools/mesa
          key: win-tools-${{ env.C3C_VERSION }}-${{ env.VULKAN_SDK_VERSION }}-${{ env.MESA_DIST_WIN_VERSION }}-vma330

      - name: Install c3c
        run: |
          if [ ! -f ~/tools/c3/c3c.exe ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.zip \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
            unzip -q /tmp/c3.zip -d ~/tools
          fi
          # fetch-sdk downloads the MSVC/WinSDK link libraries into AppData,
          # but c3c discovers msvc_sdk beside its own binary — stage it there.
          if [ ! -d ~/tools/c3/msvc_sdk ]; then
            echo Y | ~/tools/c3/c3c.exe fetch-sdk windows
            cp -r ~/AppData/Local/c3/msvc_sdk ~/tools/c3/msvc_sdk
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK
        run: |
          if [ ! -d ~/tools/VulkanSDK/Include ]; then
            curl -fsSL -o /tmp/vulkan-sdk.exe \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanSDK-${VULKAN_SDK_VERSION}-Installer.exe"
            /tmp/vulkan-sdk.exe --root "$(cygpath -w "$HOME/tools/VulkanSDK")" \
              --accept-licenses --default-answer --confirm-command install
          fi
          echo "VULKAN_SDK=$(cygpath -w "$HOME/tools/VulkanSDK")" >> "$GITHUB_ENV"
          echo "$HOME/tools/VulkanSDK/Bin" >> "$GITHUB_PATH"
          ls "$HOME/tools/VulkanSDK" || true

      - name: Install Vulkan runtime (loader dll)
        # The portable SDK ships no vulkan-1.dll; every linked binary needs the
        # loader on PATH at process start. LunarG publishes it standalone.
        run: |
          if [ ! -f ~/tools/VulkanRT/x64/vulkan-1.dll ]; then
            curl -fsSL -o /tmp/vulkanrt.zip \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanRT-${VULKAN_SDK_VERSION}-Components.zip"
            mkdir -p ~/tools/VulkanRT
            unzip -q -j /tmp/vulkanrt.zip -d ~/tools/VulkanRT/x64 "*/x64/vulkan-1.dll" || unzip -q /tmp/vulkanrt.zip -d ~/tools/VulkanRT
            find ~/tools/VulkanRT -iname vulkan-1.dll
          fi
          DLL=$(find ~/tools/VulkanRT -iname vulkan-1.dll | head -1)
          echo "loader dll: $DLL"
          # GITHUB_PATH needs a Windows-form path — the OS loader reads it.
          cygpath -w "$(dirname "$DLL")" >> "$GITHUB_PATH"

      - name: VMA header (pinned)
        # The SDK's silent install does not ship include/vma/; the build script
        # includes <vma/vk_mem_alloc.h>, so stage the pinned upstream header.
        run: |
          if [ ! -f ~/tools/vma/include/vma/vk_mem_alloc.h ]; then
            # Same tag as vma.c3l's build-vma-libs workflow, so both platforms
            # build against one VMA version.
            git clone -q --depth 1 --branch v3.3.0 \
              https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator /tmp/vma-src
            mkdir -p ~/tools/vma/include/vma
            cp /tmp/vma-src/include/vk_mem_alloc.h ~/tools/vma/include/vma/
          fi
          echo "VMA_INCLUDE=$(cygpath -w "$HOME/tools/vma/include")" >> "$GITHUB_ENV"

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build VMA static library
        run: sh lib/vma.c3l/scripts/build-vma-windows.sh

      - name: Stage vulkan-1 import library
        # vk.c3l links `vulkan-1` but is bindings-only; vma.c3l's linked-libs
        # dir is already on the linker search path, so the import lib rides there.
        run: cp "$HOME/tools/VulkanSDK/Lib/vulkan-1.lib" lib/vma.c3l/linked-libs/windows-x64/

      - name: Generator unit tests
        run: c3c test unit --path tools/gen_shader_abi

      - name: ABI drift gate
        run: C3C="$(cygpath -w "$(command -v c3c)")" python scripts/gen_abi.py --check

      - name: Build shaders
        run: GLSLC="$(cygpath -w "$(command -v glslc)")" python scripts/build_shaders.py

      - name: Link proof (smoke)
        run: |
          c3c build smoke --path test
          find test -iname "smoke*" | head
          ldd test/build/smoke.exe || true
          ./test/build/smoke.exe

      - name: CPU test targets
        run: |
          c3c test unit --path test/cpu
          c3c test shader_abi --path test/cpu

      - name: Install lavapipe (mesa-dist-win)
        run: |
          if [ ! -f ~/tools/mesa/x64/lvp_icd.x86_64.json ]; then
            mkdir -p ~/tools/mesa
            curl -fsSL -o /tmp/mesa.7z \
              "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_DIST_WIN_VERSION}/mesa3d-${MESA_DIST_WIN_VERSION}-release-msvc.7z"
            7z x -y -o"$HOME/tools/mesa" /tmp/mesa.7z >/dev/null
          fi

      - name: Register lavapipe and validation layer
        # GH windows runners are elevated, and the Vulkan loader ignores
        # VK_DRIVER_FILES / VK_LAYER_PATH in elevated processes (issue #18's
        # root cause). Registry registration is the elevated-safe path.
        run: |
          ICD="$(cygpath -w "$HOME/tools/mesa/x64/lvp_icd.x86_64.json")"
          LAYER="$(cygpath -w "$HOME/tools/VulkanSDK/Bin/VkLayer_khronos_validation.json")"
          reg add "HKLM\\SOFTWARE\\Khronos\\Vulkan\\Drivers" //v "$ICD" //t REG_DWORD //d 0 //f
          reg add "HKLM\\SOFTWARE\\Khronos\\Vulkan\\ExplicitLayers" //v "$LAYER" //t REG_DWORD //d 0 //f
          "$HOME/tools/VulkanSDK/Bin/vulkaninfoSDK.exe" --summary 2>&1 | head -25 || true

      - name: Vulkan sweep (lavapipe, advisory)
        continue-on-error: true
        run: |
          FAIL=0
          for t in vk_bootstrap vk_command vk_texture vk_descriptor_heap \
                   vk_root_pointer vk_texture_heap vk_shader_reflection vk_offscreen \
                   vk_swapchain vk_pipeline_cache vk_indirect vk_indexed_draw vk_depth vk_threading vk_queue vk_debug \
                   upload_bench_observation; do
            echo "::group::$t"
            if ! c3c test "$t" --path test; then
              echo "::warning::advisory target $t failed on windows lavapipe"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

  package-consumer-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install package-consumer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y glslc mesa-vulkan-drivers vulkan-tools

      - name: Build consumer fixture shader
        run: |
          glslc --target-env=vulkan1.3 -fshader-stage=compute -I include/shaders test/consumer/src/shader.comp.glsl \
            -o test/consumer/src/shader.comp.spv

      - name: Package policy and unit tests
        run: |
          python3 -m unittest scripts/test_package_gpu.py
          python3 scripts/package_gpu.py lock --check
          python3 scripts/package_gpu.py fixture-policy
          python3 scripts/package_gpu.py fixture-red

      - name: Assemble and verify linux-x64 package
        run: |
          python3 scripts/package_gpu.py assemble \
            --target linux-x64 \
            --output test/consumer/lib/gpu.c3l \
            --c3c-version 0.8.0_2
          python3 scripts/package_gpu.py verify \
            --bundle test/consumer/lib/gpu.c3l \
            --target linux-x64
          glslc --target-env=vulkan1.3 -fshader-stage=compute \
            -I test/consumer/lib/gpu.c3l/include/shaders \
            test/consumer/src/shader.comp.glsl \
            -o test/consumer/src/shader.comp.spv

      - name: Check and stage runtime contract
        run: |
          python3 test/consumer/lib/gpu.c3l/tools/runtime.py \
            --package test/consumer/lib/gpu.c3l \
            check --target linux-x64
          python3 test/consumer/lib/gpu.c3l/tools/runtime.py \
            --package test/consumer/lib/gpu.c3l \
            stage --target linux-x64 --destination test/consumer/build/runtime

      - name: Build and run gpu-only fixture
        run: |
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          c3c build consumer --path test/consumer
          ./test/consumer/build/consumer

  package-consumer-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Cache package toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/c3
            ~/tools/VulkanSDK
            ~/tools/VulkanRT
            ~/tools/vma
            ~/tools/mesa
          key: win-package-${{ env.C3C_VERSION }}-${{ env.VULKAN_SDK_VERSION }}-${{ env.MESA_DIST_WIN_VERSION }}-vma330

      - name: Install c3c
        run: |
          if [ ! -f ~/tools/c3/c3c.exe ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.zip \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
            unzip -q /tmp/c3.zip -d ~/tools
          fi
          if [ ! -d ~/tools/c3/msvc_sdk ]; then
            echo Y | ~/tools/c3/c3c.exe fetch-sdk windows
            cp -r ~/AppData/Local/c3/msvc_sdk ~/tools/c3/msvc_sdk
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK
        run: |
          if [ ! -d ~/tools/VulkanSDK/Include ]; then
            curl -fsSL -o /tmp/vulkan-sdk.exe \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanSDK-${VULKAN_SDK_VERSION}-Installer.exe"
            /tmp/vulkan-sdk.exe --root "$(cygpath -w "$HOME/tools/VulkanSDK")" \
              --accept-licenses --default-answer --confirm-command install
          fi
          echo "VULKAN_SDK=$(cygpath -w "$HOME/tools/VulkanSDK")" >> "$GITHUB_ENV"
          echo "$HOME/tools/VulkanSDK/Bin" >> "$GITHUB_PATH"

      - name: Install Vulkan runtime
        run: |
          if [ ! -f ~/tools/VulkanRT/x64/vulkan-1.dll ]; then
            curl -fsSL -o /tmp/vulkanrt.zip \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanRT-${VULKAN_SDK_VERSION}-Components.zip"
            mkdir -p ~/tools/VulkanRT
            unzip -q -j /tmp/vulkanrt.zip -d ~/tools/VulkanRT/x64 "*/x64/vulkan-1.dll" || unzip -q /tmp/vulkanrt.zip -d ~/tools/VulkanRT
          fi
          DLL=$(find ~/tools/VulkanRT -iname vulkan-1.dll | head -1)
          cygpath -w "$(dirname "$DLL")" >> "$GITHUB_PATH"

      - name: Install pinned VMA header
        run: |
          VMA_COMMIT=1d8f600fd424278486eade7ed3e877c99f0846b1
          if [ ! -d ~/tools/vma/source/.git ]; then
            rm -rf ~/tools/vma/source
            git clone -q --filter=blob:none --no-checkout \
              https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator \
              ~/tools/vma/source
          fi
          git -C ~/tools/vma/source fetch -q --depth 1 origin "$VMA_COMMIT"
          git -C ~/tools/vma/source checkout -q --detach "$VMA_COMMIT"
          test "$(git -C ~/tools/vma/source rev-parse HEAD)" = "$VMA_COMMIT"
          mkdir -p ~/tools/vma/include/vma
          cp ~/tools/vma/source/include/vk_mem_alloc.h ~/tools/vma/include/vma/
          echo "VMA_INCLUDE=$(cygpath -w "$HOME/tools/vma/include")" >> "$GITHUB_ENV"

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows onboarding contract
        run: |
          python - <<'PY'
          from pathlib import Path

          doc = Path("docs/getting_started.md").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          windows = doc.split("```sh windows-package", 1)[1].split("```", 1)[0]
          shared = (
              "1d8f600fd424278486eade7ed3e877c99f0846b1",
              "VMA_INCLUDE",
              "VULKAN_SDK",
              "--target windows-x64",
              "verify-vma-crt",
              "include/shaders",
          )
          for token in shared:
              assert token in windows, f"Windows onboarding omits {token}"
              assert token in workflow, f"Windows CI omits {token}"
          for token in (" lock --check", " check --target windows-x64", " stage --target windows-x64", "c3c build"):
              assert token in windows, f"Windows onboarding omits {token}"
          assemble = workflow.split("- name: Assemble and verify windows-x64 package", 1)[1].split("- name: Check and stage runtime contract", 1)[0]
          for token in ("--compiler ", "--compiler-version", "--vulkan-sdk"):
              assert token not in windows, f"Windows onboarding asserts {token}"
              assert token not in assemble, f"Windows CI asserts {token}"
          print("Windows onboarding contract: OK")
          PY

      - name: Build consumer fixture shader
        run: |
          glslc --target-env=vulkan1.3 -fshader-stage=compute -I include/shaders test/consumer/src/shader.comp.glsl \
            -o test/consumer/src/shader.comp.spv

      - name: Package policy and unit tests
        run: |
          python -m unittest scripts/test_package_gpu.py
          python scripts/package_gpu.py lock --check
          python scripts/package_gpu.py fixture-policy
          python scripts/package_gpu.py fixture-red

      - name: Assemble and verify windows-x64 package
        run: |
          python scripts/package_gpu.py assemble \
            --target windows-x64 \
            --output test/consumer/lib/gpu.c3l \
            --c3c-version 0.8.0_2
          python scripts/package_gpu.py verify \
            --bundle test/consumer/lib/gpu.c3l \
            --target windows-x64
          glslc --target-env=vulkan1.3 -fshader-stage=compute \
            -I test/consumer/lib/gpu.c3l/include/shaders \
            test/consumer/src/shader.comp.glsl \
            -o test/consumer/src/shader.comp.spv
          python scripts/package_gpu.py verify-vma-crt \
            --archive test/consumer/lib/gpu.c3l/linked-libs/windows-x64/VulkanMemoryAllocator.lib \
            --dumpbin dumpbin

      - name: Check and stage runtime contract
        run: |
          python test/consumer/lib/gpu.c3l/tools/runtime.py \
            --package test/consumer/lib/gpu.c3l \
            check --target windows-x64
          python test/consumer/lib/gpu.c3l/tools/runtime.py \
            --package test/consumer/lib/gpu.c3l \
            stage --target windows-x64 --destination test/consumer/build/runtime

      - name: Build fixture and verify PE imports
        run: |
          c3c build consumer --path test/consumer
          dumpbin //dependents test/consumer/build/consumer.exe | tee /tmp/consumer-dependents.txt
          grep -Eiq 'VCRUNTIME[0-9_]*\.dll|MSVCP[0-9_]*\.dll|ucrtbase\.dll' /tmp/consumer-dependents.txt
          if grep -Eiq 'VCRUNTIME[0-9_]*D\.dll|MSVCP[0-9_]*D\.dll|ucrtbased\.dll' /tmp/consumer-dependents.txt; then
            echo '::error::consumer imports a debug CRT'
            exit 1
          fi

      - name: Install and register lavapipe
        run: |
          if [ ! -f ~/tools/mesa/x64/lvp_icd.x86_64.json ]; then
            mkdir -p ~/tools/mesa
            curl -fsSL -o /tmp/mesa.7z \
              "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_DIST_WIN_VERSION}/mesa3d-${MESA_DIST_WIN_VERSION}-release-msvc.7z"
            7z x -y -o"$HOME/tools/mesa" /tmp/mesa.7z >/dev/null
          fi
          ICD="$(cygpath -w "$HOME/tools/mesa/x64/lvp_icd.x86_64.json")"
          reg add "HKLM\\SOFTWARE\\Khronos\\Vulkan\\Drivers" //v "$ICD" //t REG_DWORD //d 0 //f

      - name: Run gpu-only fixture
        run: |
          export VK_LOADER_LAYERS_DISABLE=~implicit~
          ./test/consumer/build/consumer.exe
