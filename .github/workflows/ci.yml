name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  C3C_VERSION: "0.8.0"
  VULKAN_SDK_VERSION: "1.3.290.0"
  MESA_DIST_WIN_VERSION: "25.1.5"
  DESCRIPTOR_BUFFER_E2E_RETEST_MESA_VERSION: "25.1.5"
  REQUIRED_GPU_CAPABILITIES: ""
  HEADLESS_TEST_TARGETS: >-
    vk_bootstrap vk_allocation vk_command vk_texture vk_descriptor_heap vk_root_pointer
    vk_texture_heap vk_shader_reflection vk_offscreen vk_swapchain
    vk_pipeline_cache vk_indirect vk_indexed_draw vk_depth vk_threading vk_performance
    vk_queue vk_debug upload_bench_observation vk_device_request vk_validation_policy

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT (Contents: read) covering this repo + the private
          # binding submodules; default GITHUB_TOKEN cannot read sibling repos.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: CI matrix drift gate
        run: |
          python3 -B -m unittest scripts/test_check_ci_matrix.py
          python3 -B scripts/check_ci_matrix.py

      - name: Documentation and source-list gate
        run: |
          python3 -B -m unittest scripts.test_check_docs
          python3 -B scripts/check_docs.py

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install shader tools and lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y glslc mesa-vulkan-drivers spirv-tools vulkan-validationlayers vulkan-tools

      - name: Select lavapipe and validation
        run: |
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          test -f "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          export VK_DRIVER_FILES="$ICD"
          vulkaninfo > /tmp/vulkaninfo.txt
          head -30 /tmp/vulkaninfo.txt
          grep -F "VK_LAYER_KHRONOS_validation" /tmp/vulkaninfo.txt
          grep -Eim1 "lavapipe|llvmpipe" /tmp/vulkaninfo.txt

      - name: CPU-only tests (no native libs)
        run: |
          c3c run import_gpu --path test/cpu
          c3c build canonical_strict_surface --path test/cpu
          c3c build import_surface_win32 --path test/cpu
          c3c build import_surface_wayland --path test/cpu
          c3c build import_surface_x11 --path test/cpu
          c3c build span_data_operations --path test/cpu
          c3c build sampler_operations --path test/cpu
          c3c build texture_view_operations --path test/cpu
          c3c test unit --path test/cpu
          c3c test shader_abi --path test/cpu

      - name: Generator unit tests
        run: |
          c3c test unit --path tools/gen_shader_abi
          python3 -B -m unittest scripts.test_gen_abi

      - name: Benchmark, command, and shader policy contract tests
        run: |
          python3 -B -m unittest scripts.test_run_benchmarks scripts.test_check_command_policy scripts.test_check_shader_reflection_policy
          python3 -B scripts/check_command_policy.py
          python3 -B scripts/check_shader_reflection_policy.py

      - name: ABI drift gate
        run: python3 scripts/gen_abi.py --check

      - name: Build shaders
        run: python3 scripts/build_shaders.py

      - name: Build benchmark targets
        run: |
          for spec in $(python3 -c 'import scripts.run_benchmarks as b; print(*[f"{target}:{project}" for target, project in b.benchmark_build_targets()])'); do
            target="${spec%%:*}"
            project="${spec#*:}"
            c3c build "$target" --path "$project" -O1
          done

      - name: Link proof (smoke)
        run: |
          c3c build smoke --path test
          ./test/build/smoke

      - name: Test sweep (lavapipe)
        run: |
          set -o pipefail
          FAIL=0
          : > /tmp/vulkan-capabilities.txt
          for t in $HEADLESS_TEST_TARGETS; do
            echo "::group::$t"
            if ! c3c test "$t" --path test --test-show-output 2>&1 \
              | tee -a /tmp/vulkan-capabilities.txt; then
              echo "::error::target $t failed"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          for capability in $REQUIRED_GPU_CAPABILITIES; do
            if ! grep -Fq "$capability: EXERCISED" /tmp/vulkan-capabilities.txt; then
              echo "::error::required capability $capability was not exercised"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check API and backend boundaries
        run: |
          python -m unittest scripts.test_check_public_api scripts.test_check_backend_dispatch scripts.test_check_retired_api scripts.test_check_swapchain_acquire_policy
          python scripts/check_public_api.py
          python scripts/check_backend_dispatch.py
          python scripts/check_swapchain_acquire_policy.py
          python scripts/check_retired_api.py

      # Whole-compile reference (public module gpu + gpu::vk internals; a
      # scoped docgen needs a closed source set, which only the whitebox test
      # project provides). Published as a per-run artifact.
      - name: Generate API reference
        run: |
          cd test && c3c docgen
      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: test/docs.html

  docs-walkthrough:
    # Executes docs/getting_started.md verbatim (scripts/run_doc.py) on a bare
    # runner: the walkthrough is its own regression test. Only checkout and
    # repository authentication are outside the document.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install walkthrough prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools

      # Let the recursive clone authenticate to the binding repositories.
      - name: Authenticate submodule clones
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/fesoliveira014/".insteadOf \
            "https://github.com/fesoliveira014/"

      - name: Run the walkthrough
        run: |
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export GPU_C3L_URL="$GITHUB_WORKSPACE"
          python3 scripts/run_doc.py docs/getting_started.md --workspace /tmp/walkthrough

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      REQUIRED_GPU_CAPABILITIES: >-
        generated-work generated-scratch-reservation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT (Contents: read) covering this repo + the private
          # binding submodules; default GITHUB_TOKEN cannot read sibling repos.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Documentation and source-list gate
        run: |
          python -B -m unittest scripts.test_check_docs
          python -B scripts/check_docs.py

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/c3
            ~/tools/VulkanSDK
            ~/tools/VulkanRT
            ~/tools/vma
            ~/tools/mesa
          key: win-tools-${{ env.C3C_VERSION }}-${{ env.VULKAN_SDK_VERSION }}-${{ env.MESA_DIST_WIN_VERSION }}-vma330

      - name: Install c3c
        run: |
          if [ ! -f ~/tools/c3/c3c.exe ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.zip \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
            unzip -q /tmp/c3.zip -d ~/tools
          fi
          # fetch-sdk downloads the MSVC/WinSDK link libraries into AppData,
          # but c3c discovers msvc_sdk beside its own binary — stage it there.
          if [ ! -d ~/tools/c3/msvc_sdk ]; then
            echo Y | ~/tools/c3/c3c.exe fetch-sdk windows
            cp -r ~/AppData/Local/c3/msvc_sdk ~/tools/c3/msvc_sdk
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK
        run: |
          if [ ! -d ~/tools/VulkanSDK/Include ]; then
            curl -fsSL -o /tmp/vulkan-sdk.exe \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanSDK-${VULKAN_SDK_VERSION}-Installer.exe"
            /tmp/vulkan-sdk.exe --root "$(cygpath -w "$HOME/tools/VulkanSDK")" \
              --accept-licenses --default-answer --confirm-command install
          fi
          echo "VULKAN_SDK=$(cygpath -w "$HOME/tools/VulkanSDK")" >> "$GITHUB_ENV"
          echo "$HOME/tools/VulkanSDK/Bin" >> "$GITHUB_PATH"
          ls "$HOME/tools/VulkanSDK" || true

      - name: Install Vulkan runtime (loader dll)
        # The portable SDK ships no vulkan-1.dll; every linked binary needs the
        # loader on PATH at process start. LunarG publishes it standalone.
        run: |
          if [ ! -f ~/tools/VulkanRT/x64/vulkan-1.dll ]; then
            curl -fsSL -o /tmp/vulkanrt.zip \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanRT-${VULKAN_SDK_VERSION}-Components.zip"
            mkdir -p ~/tools/VulkanRT
            unzip -q -j /tmp/vulkanrt.zip -d ~/tools/VulkanRT/x64 "*/x64/vulkan-1.dll" || unzip -q /tmp/vulkanrt.zip -d ~/tools/VulkanRT
            find ~/tools/VulkanRT -iname vulkan-1.dll
          fi
          DLL=$(find ~/tools/VulkanRT -iname vulkan-1.dll | head -1)
          echo "loader dll: $DLL"
          # GITHUB_PATH needs a Windows-form path — the OS loader reads it.
          cygpath -w "$(dirname "$DLL")" >> "$GITHUB_PATH"

      - name: VMA header (pinned)
        # The SDK's silent install does not ship include/vma/; the build script
        # includes <vma/vk_mem_alloc.h>, so stage the pinned upstream header.
        run: |
          if [ ! -f ~/tools/vma/include/vma/vk_mem_alloc.h ]; then
            # Same tag as vma.c3l's build-vma-libs workflow, so both platforms
            # build against one VMA version.
            git clone -q --depth 1 --branch v3.3.0 \
              https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator /tmp/vma-src
            mkdir -p ~/tools/vma/include/vma
            cp /tmp/vma-src/include/vk_mem_alloc.h ~/tools/vma/include/vma/
          fi
          echo "VMA_INCLUDE=$(cygpath -w "$HOME/tools/vma/include")" >> "$GITHUB_ENV"

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build VMA static library
        run: sh lib/vma.c3l/scripts/build-vma-windows.sh

      - name: Stage vulkan-1 import library
        # vk.c3l links `vulkan-1` but is bindings-only; vma.c3l's linked-libs
        # dir is already on the linker search path, so the import lib rides there.
        run: cp "$HOME/tools/VulkanSDK/Lib/vulkan-1.lib" lib/vma.c3l/linked-libs/windows-x64/

      - name: Generator unit tests
        run: |
          c3c test unit --path tools/gen_shader_abi
          python -B -m unittest scripts.test_gen_abi

      - name: Benchmark, command, and shader policy contract tests
        run: |
          python -B -m unittest scripts.test_run_benchmarks scripts.test_check_command_policy scripts.test_check_shader_reflection_policy
          python -B scripts/check_command_policy.py
          python -B scripts/check_shader_reflection_policy.py

      - name: ABI drift gate
        run: C3C="$(cygpath -w "$(command -v c3c)")" python scripts/gen_abi.py --check

      - name: Build shaders
        run: |
          GLSLC="$(cygpath -w "$(command -v glslc)")" \
          SPIRV_AS="$(cygpath -w "$(command -v spirv-as)")" \
          python scripts/build_shaders.py

      - name: Build benchmark targets
        run: |
          for spec in $(python -c 'import scripts.run_benchmarks as b; print(*[f"{target}:{project}" for target, project in b.benchmark_build_targets()])'); do
            target="${spec%%:*}"
            project="${spec#*:}"
            c3c build "$target" --path "$project" -O1
          done

      - name: Link proof (smoke)
        run: |
          c3c build smoke --path test
          find test -iname "smoke*" | head
          ldd test/build/smoke.exe || true
          ./test/build/smoke.exe

      - name: CPU test targets
        run: |
          c3c run import_gpu --path test/cpu
          c3c build canonical_strict_surface --path test/cpu
          c3c build import_surface_win32 --path test/cpu
          c3c build import_surface_wayland --path test/cpu
          c3c build import_surface_x11 --path test/cpu
          c3c build span_data_operations --path test/cpu
          c3c build sampler_operations --path test/cpu
          c3c build texture_view_operations --path test/cpu
          c3c test unit --path test/cpu
          c3c test shader_abi --path test/cpu

      - name: Check backend dispatch ownership
        run: |
          python -m unittest scripts.test_check_backend_dispatch scripts.test_check_swapchain_acquire_policy
          python scripts/check_backend_dispatch.py
          python scripts/check_swapchain_acquire_policy.py

      - name: Install lavapipe (mesa-dist-win)
        run: |
          if [ ! -f ~/tools/mesa/x64/lvp_icd.x86_64.json ]; then
            mkdir -p ~/tools/mesa
            curl -fsSL -o /tmp/mesa.7z \
              "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_DIST_WIN_VERSION}/mesa3d-${MESA_DIST_WIN_VERSION}-release-msvc.7z"
            7z x -y -o"$HOME/tools/mesa" /tmp/mesa.7z >/dev/null
          fi

      - name: Register lavapipe and validation layer
        # GH windows runners are elevated, and the Vulkan loader ignores
        # VK_DRIVER_FILES / VK_LAYER_PATH. Registry registration is reliable.
        run: |
          ICD="$(cygpath -w "$HOME/tools/mesa/x64/lvp_icd.x86_64.json")"
          LAYER="$(cygpath -w "$HOME/tools/VulkanSDK/Bin/VkLayer_khronos_validation.json")"
          reg add "HKLM\\SOFTWARE\\Khronos\\Vulkan\\Drivers" //v "$ICD" //t REG_DWORD //d 0 //f
          reg add "HKLM\\SOFTWARE\\Khronos\\Vulkan\\ExplicitLayers" //v "$LAYER" //t REG_DWORD //d 0 //f
          "$HOME/tools/VulkanSDK/Bin/vulkaninfoSDK.exe" > /tmp/vulkaninfo.txt 2>&1
          head -30 /tmp/vulkaninfo.txt
          grep -F "VK_LAYER_KHRONOS_validation" /tmp/vulkaninfo.txt
          grep -Eim1 "lavapipe|llvmpipe" /tmp/vulkaninfo.txt

      - name: Vulkan sweep (lavapipe)
        run: |
          set -o pipefail
          FAIL=0
          : > /tmp/vulkan-capabilities.txt
          for t in $HEADLESS_TEST_TARGETS; do
            echo "::group::$t"
            if ! c3c test "$t" --path test --test-show-output 2>&1 \
              | tee -a /tmp/vulkan-capabilities.txt; then
              echo "::error::target $t failed on windows lavapipe"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          for capability in $REQUIRED_GPU_CAPABILITIES; do
            if ! grep -Fq "$capability: EXERCISED" /tmp/vulkan-capabilities.txt; then
              echo "::error::required capability $capability was not exercised"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Descriptor-buffer coverage status
        run: |
          if [ "$MESA_DIST_WIN_VERSION" != "$DESCRIPTOR_BUFFER_E2E_RETEST_MESA_VERSION" ]; then
            echo "::error::mesa-dist-win changed; rerun the gated descriptor-buffer shader E2E and update DESCRIPTOR_BUFFER_E2E_RETEST_MESA_VERSION"
            exit 1
          fi
          c3c test vk_texture_heap --path test \
            --test-filter descriptor_buffer_device_and_heap --test-show-output 2>&1 \
            | tee /tmp/descriptor-buffer.txt
          if grep -Fq "descriptor-buffer capability unavailable" /tmp/descriptor-buffer.txt; then
            echo "::notice::descriptor-buffer layout/write path not exercised on this adapter"
            echo "Descriptor-buffer layout/write: NOT EXERCISED (adapter support unavailable)." >> "$GITHUB_STEP_SUMMARY"
          elif ! grep -Fq "Testing gpu_test::descriptor_buffer_device_and_heap" /tmp/descriptor-buffer.txt; then
            echo "::error::descriptor-buffer test filter matched no test"
            exit 1
          else
            echo "Descriptor-buffer layout/write: EXERCISED on mesa-dist-win ${MESA_DIST_WIN_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Descriptor-buffer shader E2E: NOT EXERCISED (retest required when the Mesa pin changes)." >> "$GITHUB_STEP_SUMMARY"
